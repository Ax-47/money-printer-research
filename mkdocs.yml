site_name: money-printer-research
repo_url: https://github.com/Ax-47/money-printer-research
site_url: https://Ax-47.github.io/money-printer-research
site_description: Collect, clean and model football match data from Understat and Transfermarkt.
site_author: Mikhail Akhsakov
edit_uri: edit/main/docs/
repo_name: Ax-47/money-printer-research
copyright: Maintained by <a href="https://Ax-47.com">Ax-47</a>.
nav:
  - Home:
    - index.md
    - Getting started: getting-started.md
    - Commands: cli.md
    - Data pipeline:
      - pipeline/index.md
      - 1. Collect: pipeline/collect.md
      - 2. Clean: pipeline/clean.md
      - 3. Features: pipeline/features.md
    - Schemas:
      - schema/index.md
      - Match: schema/match.md
      - Player: schema/player.md
      - Club: schema/club.md
      - Competition: schema/competition.md
    - Docker and API: docker-api.md
    - About: about.md
    - Configuration: configuration.md
  - Source Code API Reference:
    - api/index.md
    - data_collection: api/data_collection.md
    - clean_data: api/clean_data.md
    - features: api/features.md
    - schema: api/schema.md
    - analysis: api/analysis.md
    - cool_stuff: api/cool_stuff.md
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.select
plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          # search packages in the src folder
          paths: ["src"]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: True
            docstring_section_style: spacy
            merge_init_into_class: True
  - mkdocs-jupyter:
      # ignore_h1_titles: true # Ignore using first h1 as title, instead use filename.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ax-47/money-printer-research
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/money-printer-research
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.pathconverter
  - pymdownx.snippets:
      base_path: ["."] # Using --8<-- "dir/file.md" is relative to the base_path.
  - toc:
      permalink: true
hooks:
  - docs/hooks/schema_tables.py
exclude_docs: |
  hooks/
