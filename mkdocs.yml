site_name: money-printer-research
repo_url: https://github.com/Ax-47/money-printer-research
site_url: https://Ax-47.github.io/money-printer-research
site_description: Collect, clean and model football match data from Understat and Transfermarkt.
site_author: Mikhail Akhsakov
edit_uri: edit/main/docs/
repo_name: Ax-47/money-printer-research
copyright: Maintained by <a href="https://Ax-47.com">Ax-47</a>.
nav:
  - Introduction: index.md
  - Getting started: getting-started.md
  - Commands: cli.md
  - Data pipeline:
    - pipeline/index.md
    - Collect: pipeline/collect.md
    - Clean: pipeline/clean.md
    - Features: pipeline/features.md
  - Schemas:
    - schema/index.md
    - Match: schema/match.md
    - Player: schema/player.md
    - Club: schema/club.md
    - Competition: schema/competition.md
  - Docker and API: docker-api.md
  - Configuration: configuration.md
  - About: about.md
  - Source code API reference:
    - api/index.md
    - data_collection: api/data_collection.md
    - clean_data: api/clean_data.md
    - features: api/features.md
    - schema: api/schema.md
    - analysis: api/analysis.md
    - cool_stuff: api/cool_stuff.md
theme:
  name: material
  language: en
  icon:
    logo: material/soccer
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Open Sans
    code: Source Code Pro
  # The five mdBook themes; the header button cycles through them in order.
  # Colors live in docs/stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: light
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: "Light theme (switch to Rust)"
    - scheme: rust
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: "Rust theme (switch to Coal)"
    - scheme: coal
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: "Coal theme (switch to Navy)"
    - media: "(prefers-color-scheme: dark)"
      scheme: navy
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: "Navy theme (switch to Ayu)"
    - scheme: ayu
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: "Ayu theme (switch to Light)"
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          # search packages in the src folder
          paths: ["src"]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: True
            docstring_section_style: spacy
            merge_init_into_class: True
  - mkdocs-jupyter:
      # ignore_h1_titles: true # Ignore using first h1 as title, instead use filename.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ax-47/money-printer-research
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.pathconverter
  - pymdownx.snippets:
      base_path: ["."] # Using --8<-- "dir/file.md" is relative to the base_path.
  - toc:
      permalink: true
hooks:
  - docs/hooks/schema_tables.py
exclude_docs: |
  hooks/
