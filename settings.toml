# Project settings. Every key, default and env override: docs/configuration.md
# Print what is in effect: uv run show_config
[transfermarkt]
first_season = 2014

[transfermarkt.leagues]
GB1 = "ENG-Premier League"
ES1 = "ESP-La Liga"
L1 = "GER-Bundesliga"
IT1 = "ITA-Serie A"
FR1 = "FRA-Ligue 1"
[understat]
leagues = [
  "ENG-Premier League",
  "ESP-La Liga",
  "GER-Bundesliga",
  "ITA-Serie A",
  "FRA-Ligue 1",
  # "RUS-Premier League",
]
start_year = 2014
end_year = 2026
out_dir = "data/raw/player_stats"
schedule_file = "data/raw/xg_schedule.csv"
cache_dir = "data/Understat"

[clean]
out_dir = "data/clean"
# Not read yet: reserved for the planned API (issue #6).
[api_settings]
host = "0.0.0.0"
port = 8000
