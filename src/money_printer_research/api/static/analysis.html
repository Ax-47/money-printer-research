<style>
  .jump { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px 0; margin-bottom: 12px; background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .jump a { padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel);
    color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 500; transition: color .15s, border-color .15s; }
  .jump a:hover { color: var(--accent); border-color: var(--accent); }
  .answer { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .claim { position: relative; padding: 16px 18px 16px 20px; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .claim::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
    background: linear-gradient(var(--mauve), var(--blue)); }
  .claim b { display: block; margin-bottom: 6px; font-size: 1rem; }
  .claim p { margin: 0; color: var(--muted); font-size: .9rem; }
  section { margin-top: 44px; scroll-margin-top: 56px; }
  section > h2 { font-size: 1.3rem; }
  th, td { white-space: nowrap; }
  th:first-child, td:first-child { white-space: normal; }
  th[data-key] { cursor: pointer; user-select: none; }
  th[data-key]:hover { color: var(--text); }
  th[aria-sort="descending"]::after { content: " ↓"; color: var(--accent); }
  th[aria-sort="ascending"]::after { content: " ↑"; color: var(--accent); }
  .ci { color: var(--muted); font-size: .8rem; }
  svg.chart { display: block; max-width: 100%; height: auto; }
  svg.chart text { font: 12px var(--font); fill: var(--muted); }
  svg.chart .label { fill: var(--text); }
  svg.chart .zero { stroke: var(--overlay1); stroke-dasharray: 3 3; }
  svg.chart .range { stroke-width: 2.5; stroke-linecap: round; }
  svg.chart .row .hit { fill: transparent; }
  svg.chart .row:hover .hit { fill: var(--border); opacity: .5; }
  .meter { display: inline-block; vertical-align: middle; width: 80px; height: 8px; margin-left: 8px;
    background: var(--border); border-radius: 4px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--peach), var(--red)); border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); margin: 4px 0 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
  .note { font-size: .82rem; color: var(--muted); margin: 28px 0 0; text-align: center; }
</style>
</head>

      p_exchange: "Betfair exchange หลังหักค่าคอมมิชชัน", p_commission: "ค่าคอมมิชชัน",
      meta: "{games} นัด จาก {leagues} ลีก ฤดูกาล {first} ถึง {last} · สร้างเมื่อ {generated} จากโค้ด {commit}{dirty}, strategies.toml {suite}",
      dirty: " (มีการแก้ไขที่ยังไม่ commit)",
      rebuild: "สร้างใหม่ด้วย {a} แล้วตามด้วย {b} · JSON ดิบ: {json}", analysis: "บทวิเคราะห์",
      fc_early: "ราคาเปิด Pinnacle", fc_close: "ราคาปิด Pinnacle", fc_market_refit: "ราคาเปิด ปรับเทียบใหม่",
      fc_market_and_form: "ราคาเปิด + ฟอร์มทีม", fc_form_only: "ฟอร์มทีมอย่างเดียว",

  // Strategy and forecaster names come from the data in English; in Thai they are looked
  // up here, and a name with no translation stays as it is.
  const STRATEGY_TH = {
    "model EV, Pinnacle early": "โมเดล EV, ราคาเปิด Pinnacle", "model EV, best price early": "โมเดล EV, ราคาดีสุด ราคาเปิด",
    "model draw": "โมเดล แทงเสมอ", "favourite": "แทงทีมต่อ", "longshot": "แทงทีมรอง", "odds band": "ช่วงราคา",
    "always home": "แทงเจ้าบ้านทุกนัด", "always draw": "แทงเสมอทุกนัด", "always away": "แทงทีมเยือนทุกนัด",
    "always over 2.5": "แทงสูง 2.5 ทุกนัด", "always under 2.5": "แทงต่ำ 2.5 ทุกนัด",
    "always AH home": "แทงแฮนดิแคปเจ้าบ้านทุกนัด", "always AH away": "แทงแฮนดิแคปทีมเยือนทุกนัด",
    "value 1X2, best price early": "value 1X2, ราคาดีสุด ราคาเปิด", "value 1X2, best price close": "value 1X2, ราคาดีสุด ราคาปิด",
    "value 1X2, Bet365 early": "value 1X2, ราคาเปิด Bet365", "value AH, best price early": "value แฮนดิแคป, ราคาดีสุด ราคาเปิด",
    "value O/U 2.5, best price early": "value สูง/ต่ำ 2.5, ราคาดีสุด ราคาเปิด",
  };
  const PARAMETER_TH = { min_edge: "edge ขั้นต่ำ", band: "ช่วง" };
  function strategyName(variant) {
    if (lang !== "th") return variant;
    const [, name, parameter, value] = variant.match(/^(.*?)(?: \[(\w+)=(.*)\])?$/);
    const shown = STRATEGY_TH[name] ?? name;
    return parameter ? `${shown} [${PARAMETER_TH[parameter] ?? parameter}=${value}]` : shown;
  }
  const forecasterName = (id) => (lang === "th" && STRINGS.th[`fc_${id}`]) || data.model.names[id] || id;

  const pct = (x, d = 1) => (x == null ? "–" : `${x > 0 ? "+" : ""}${(x * 100).toFixed(d)}%`);
  const share = (x) => (x == null ? "–" : `${Math.round(x * 100)}%`);
  const num = (x, d = 4) => (x == null ? "–" : `${x > 0 ? "+" : ""}${x.toFixed(d)}`);
  const tone = (x) => (x > 0 ? "plus" : x < 0 ? "minus" : "");
  const season = (s) => `${s}/${String((s + 1) % 100).padStart(2, "0")}`;
  const planName = (plan) => t(`plan_${plan}`);

  function svg(tag, attrs, ...children) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    node.append(...children);
    return node;
  }

  // Estimate and 95% interval per row, zero marked. lowerIsBetter says which side of zero
  // is good: a row wholly on the good side is green, wholly on the bad side red, and the
  // tooltip says which in words, so colour is never the only cue.
  function intervalChart(rows, fmt, lowerIsBetter = false) {
    // Drawn at the page's width, so text keeps its size: labels sit beside the lines when
    // there is room and above them on a phone.
    const w = Math.max(300, Math.min(900, $("result").clientWidth - 40));
    const narrow = w < 600, pad = 12, labelW = narrow ? 0 : Math.min(330, w * 0.42);
    const rowH = narrow ? 40 : 24, h = rows.length * rowH + 30;
    const vals = rows.flatMap((r) => [r.mid, r.low, r.high]).concat(0);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = hi - lo || 1; lo -= span * 0.04; hi += span * 0.04;
    const x = (v) => labelW + pad + ((v - lo) / (hi - lo)) * (w - labelW - pad * 2);
    const side = (r) => (r.low > 0 ? 1 : r.high < 0 ? -1 : 0) * (lowerIsBetter ? -1 : 1);
    const verdict = (r) => t(["v_worse", "v_unclear", "v_better"][side(r) + 1]);
    const colour = (r) => ["var(--red)", "var(--blue)", "var(--green)"][side(r) + 1];
    return svg("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, class: "chart", role: "img" },
      svg("line", { class: "zero", x1: x(0), x2: x(0), y1: 2, y2: h - 22 }),
      svg("text", { x: x(0), y: h - 6, "text-anchor": "middle" }, "0"),
      // The ends of the scale, unless one would crowd the 0.
      ...[[lo, "start"], [hi, "end"]].filter(([v]) => Math.abs(x(v) - x(0)) > 44)
        .map(([v, anchor]) => svg("text", { x: x(v), y: h - 6, "text-anchor": anchor }, fmt(v))),
      ...rows.map((r, i) => {
        const y = (narrow ? 26 : 14) + i * rowH;
        const label = narrow
          ? svg("text", { class: "label", x: pad, y: y - 10 }, r.label)
          : svg("text", { class: "label", x: labelW, y: y + 4, "text-anchor": "end" }, r.label);
        return svg("g", { class: "row" },
          svg("title", {}, t("tooltip", { label: r.label, mid: fmt(r.mid), low: fmt(r.low), high: fmt(r.high), verdict: verdict(r) })),
          svg("rect", { class: "hit", x: 0, y: y - rowH / 2 - (narrow ? 6 : 0), width: w, height: rowH }),
          label,
          svg("line", { class: "range", x1: x(r.low), x2: x(r.high), y1: y, y2: y, stroke: colour(r) }),
          svg("circle", { cx: x(r.mid), cy: y, r: 4.5, fill: colour(r), stroke: "var(--panel)", "stroke-width": 2 }));
      }));
  }

  function legend(good, neutral, bad) {
    return el("div", { className: "legend" },
      el("span", {}, el("i", { style: "background: var(--green)" }), good),
      el("span", {}, el("i", { style: "background: var(--blue)" }), neutral),
      el("span", {}, el("i", { style: "background: var(--red)" }), bad));
  }

  // A table whose columns with a key sort on click; cells are built by each column's cell().
  function table(columns, rows, sortKey = null) {
    let key = sortKey, desc = true;
    const wrap = el("div", { className: "scroll" });
    function draw() {
      const sorted = key ? [...rows].sort((a, b) => ((a[key] ?? -Infinity) - (b[key] ?? -Infinity)) * (desc ? -1 : 1)) : rows;
      const head = columns.map((c) => {
        const th = el("th", {}, c.title);
        if (c.key) th.dataset.key = c.key;
        if (c.key && c.key === key) th.setAttribute("aria-sort", desc ? "descending" : "ascending");
        if (c.key) th.addEventListener("click", () => { desc = key === c.key ? !desc : true; key = c.key; draw(); });
        return th;
      });
      wrap.replaceChildren(el("table", {}, el("thead", {}, el("tr", {}, ...head)),
        el("tbody", {}, ...sorted.map((r) => el("tr", {}, ...columns.map((c) => el("td", {}, c.cell(r))))))));
    }
    draw();
    return wrap;
  }

  const withCi = (fmt, mid, low, high) => (r) => el("span", { className: tone(r[mid]) }, fmt(r[mid]), " ",
    el("span", { className: "ci" }, `(${t("ci_text", { a: fmt(r[low]), b: fmt(r[high]) })})`));

  function section(id, title, intro, ...body) {
    return el("section", { id }, el("h2", {}, title), el("p", { className: "sub" }, intro), ...body);
  }

  let data = null;
  const state = { league: stored("analysis-league") || "ALL", measure: stored("analysis-measure") || "close_ev",
    variant: stored("analysis-variant"), seasons: Number(stored("analysis-seasons")) || 3 };

  function modelSection() {
    const m = data.model;
    return section("model", t("m_title"), t("m_intro", { games: data.meta.test_games.toLocaleString() }),
      el("div", { className: "card" },
        legend(t("m_good"), t("m_neutral"), t("m_bad")),
        intervalChart(m.comparisons.map((r) => ({
          label: t("m_vs", { a: forecasterName(r.a), b: forecasterName(r.b) }), mid: r.log_loss, low: r.log_loss_low, high: r.log_loss_high })),
          (v) => num(v), true)),
      el("h3", {}, t("m_means")),
      table([
        { title: t("m_forecaster"), cell: (r) => forecasterName(r.forecaster) },
        { title: t("m_log_loss"), key: "log_loss", cell: (r) => r.log_loss.toFixed(4) },
        { title: t("m_rps"), key: "rps", cell: (r) => r.rps.toFixed(4) },
      ], m.forecasters),
      el("h3", {}, t("m_by_league")),
      table([
        { title: t("league"), cell: (r) => r.league },
        { title: t("games"), key: "games", cell: (r) => r.games.toLocaleString() },
        { title: t("m_diff"), key: "log_loss", cell: (r) => el("span", {}, num(r.log_loss), " ",
          el("span", { className: "ci" }, `(${t("ci_text", { a: num(r.log_loss_low), b: num(r.log_loss_high) })})`)) },
      ], m.by_league));
  }

  function strategySection() {
    const s = data.strategies;
    const league = el("select", { id: "league" }, ...s.leagues.map((v) => el("option", { value: v, selected: v === state.league }, v === "ALL" ? t("all_leagues") : v)));
    const measure = el("select", { id: "measure" },
      el("option", { value: "close_ev", selected: state.measure === "close_ev" }, t("close_ev_long")),
      el("option", { value: "roi", selected: state.measure === "roi" }, t("roi_long")));
    league.addEventListener("change", () => { state.league = league.value; store("analysis-league", league.value); load(); });
    measure.addEventListener("change", () => { state.measure = measure.value; store("analysis-measure", measure.value); render(); });
    const m = state.measure;
    const rows = s.scores.filter((r) => r[`${m}_low`] != null)
      .sort((a, b) => b[m] - a[m])
      .map((r) => ({ label: strategyName(r.variant), mid: r[m], low: r[`${m}_low`], high: r[`${m}_high`] }));
    const cells = s.scores.length;
    return section("strategies", t("s_title"), t("s_intro", { season: season(data.meta.test_from) }),
      el("div", { className: "filters" },
        el("label", {}, t("league"), league), el("label", {}, t("measure"), measure)),
      el("div", { className: "card" },
        legend(t("s_good"), t("s_neutral"), t("s_bad")),
        intervalChart(rows, (v) => pct(v))),
      el("h3", {}, t("s_every", { cells })),
      table([
        { title: t("strategy"), cell: (r) => strategyName(r.variant) },
        { title: t("bets"), key: "bets", cell: (r) => r.bets.toLocaleString() },
        { title: t("roi"), key: "roi", cell: withCi(pct, "roi", "roi_low", "roi_high") },
        { title: t("close_ev"), key: "close_ev", cell: (r) => (r.close_ev_low == null ? "–" : withCi(pct, "close_ev", "close_ev_low", "close_ev_high")(r)) },
        { title: t("q_value"), key: "q_value", cell: (r) => r.q_value.toFixed(2) },
      ], s.scores, "roi"),
      el("h3", {}, t("s_walk")),
      table([
        { title: t("strategy"), cell: (r) => strategyName(r.strategy) },
        { title: t("seasons"), key: "seasons", cell: (r) => r.seasons },
        { title: t("bets"), key: "bets", cell: (r) => r.bets.toLocaleString() },
        { title: t("roi"), key: "roi", cell: withCi(pct, "roi", "roi_low", "roi_high") },
      ], s.walk_forward, "roi"));
  }

  function stakingSection() {
    const st = data.staking;
    const variants = [...new Set(st.replay.map((r) => r.variant))];
    if (!variants.includes(state.variant)) state.variant = variants[0];
    const variant = el("select", {}, ...variants.map((v) => el("option", { value: v, selected: v === state.variant }, strategyName(v))));
    const horizon = el("select", {}, ...[1, 3, 5].map((n) => el("option", { value: n, selected: n === state.seasons }, t("k_seasons", { n }))));
    variant.addEventListener("change", () => { state.variant = variant.value; store("analysis-variant", variant.value); render(); });
    horizon.addEventListener("change", () => { state.seasons = Number(horizon.value); store("analysis-seasons", horizon.value); render(); });
    const meter = (x) => el("span", {}, share(x), el("span", { className: "meter", role: "presentation" }, el("span", { style: `width:${(x * 100).toFixed(1)}%` })));
    return section("staking", t("k_title"), t("k_intro"),
      el("div", { className: "filters" }, el("label", {}, t("strategy"), variant), el("label", {}, t("k_history"), horizon)),
      el("h3", {}, t("k_happened")),
      table([
        { title: t("plan"), cell: (r) => planName(r.plan) },
        { title: t("k_final"), key: "final", cell: (r) => el("span", { className: tone(r.final - 1) }, `${r.final.toFixed(2)}×`) },
        { title: t("k_lowest"), key: "lowest", cell: (r) => `${r.lowest.toFixed(2)}×` },
        { title: t("k_drawdown"), key: "max_drawdown", cell: (r) => share(r.max_drawdown) },
      ], st.replay.filter((r) => r.variant === state.variant)),
      el("h3", {}, t("k_resampled", { n: state.seasons })),
      table([
        { title: t("plan"), cell: (r) => planName(r.plan) },
        { title: t("k_half"), key: "p_lose_half", cell: (r) => meter(r.p_lose_half) },
        { title: t("k_90"), key: "p_lose_90", cell: (r) => meter(r.p_lose_90) },
        { title: t("k_median"), key: "median_final", cell: (r) => `${r.median_final.toFixed(2)}×` },
      ], st.ruin.filter((r) => r.variant === state.variant && r.seasons === state.seasons)));
  }

  function practicalitySection() {
    const p = data.practicality;
    return section("practicality", t("p_title"), t("p_intro"),
      el("h3", {}, t("p_time")),
      table([
        { title: t("strategy"), cell: (r) => strategyName(r.variant) },
        { title: t("p_per_season"), key: "bets_per_season", cell: (r) => r.bets_per_season.toLocaleString() },
        { title: t("close_ev"), key: "close_ev", cell: (r) => pct(r.close_ev) },
        { title: t("p_units"), key: "units_per_season_close_ev", cell: (r) => r.units_per_season_close_ev.toFixed(0) },
        { title: t("p_needed"), key: "seasons_needed_close_ev", cell: (r) => r.seasons_needed_close_ev.toFixed(0) },
      ], p.time),
      el("h3", {}, t("p_limits")),
      table([
        { title: t("p_accounts"), cell: (r) => (r.accounts == null ? t("p_no_limit") : r.accounts) },
        { title: t("p_closed"), cell: (r) => (r.limit == null ? "–" : t("p_stakes", { n: r.limit })) },
        { title: t("p_placed"), key: "bets", cell: (r) => r.bets.toLocaleString() },
        { title: t("p_profit"), key: "profit", cell: (r) => el("span", { className: tone(r.profit) }, `${r.profit > 0 ? "+" : ""}${r.profit.toFixed(0)}`) },
        { title: t("p_last"), cell: (r) => r.last_day ?? "–" },
      ], p.limits),
      el("h3", {}, t("p_exchange")),
      table([
        { title: t("p_commission"), cell: (r) => share(r.commission) },
        { title: t("bets"), key: "bets", cell: (r) => r.bets.toLocaleString() },
        { title: t("roi"), key: "roi", cell: (r) => el("span", { className: tone(r.roi) }, pct(r.roi)) },
        { title: t("close_ev"), key: "close_ev", cell: (r) => pct(r.close_ev) },
      ], p.exchange));
  }

  // "Rebuild with … then …. Raw JSON: …", with the commands and link as elements.
  function rebuildNote() {
    const parts = { a: el("code", {}, "uv run collect_data"), b: el("code", {}, "uv run report"),
      json: el("a", { href: `analysis?league=${encodeURIComponent(state.league)}` }, "/analysis") };
    const text = t("rebuild", { a: "\u0000a\u0000", b: "\u0000b\u0000", json: "\u0000json\u0000" });
    return el("p", { className: "note" }, ...text.split("\u0000").map((piece, i) => (i % 2 ? parts[piece] : piece)));
  }

  function render() {
    const m = data.meta;
    document.title = t("doc_title");
    $("meta").textContent = t("meta", { games: m.games.toLocaleString(), leagues: m.leagues.length,
      first: season(m.first_season), last: season(m.last_season), generated: m.generated,
      commit: m.code_commit, dirty: m.dirty ? t("dirty") : "", suite: m.suite_commit });
    const answer = (lang === "th" && data.summary_th) || data.summary;
    const y = scrollY;
    $("result").replaceChildren(
      el("div", { className: "jump" }, ...["answer", "model", "strategies", "staking", "practicality"]
        .map((id) => el("a", { href: `#${id}` }, t(`jump_${id}`)))),
      el("section", { id: "answer" }, el("div", { className: "answer" },
        ...answer.map((c) => el("div", { className: "claim" }, el("b", {}, c.headline), el("p", {}, c.detail))))),
      modelSection(), strategySection(), stakingSection(), practicalitySection(),
      rebuildNote());
    scrollTo(0, y);
  }

  async function load() {
    const res = await fetch(`analysis?league=${encodeURIComponent(state.league)}`);
    if (!res.ok) {
      $("meta").textContent = "";
      $("result").replaceChildren(notRun(t("analysis"), "report"));
      return;
    }
    data = await res.json();
    if (!data.strategies.leagues.includes(state.league)) { state.league = "ALL"; return load(); }
    render();
  }

  onLang(() => (data ? render() : load()));

  let resized = null;
  addEventListener("resize", () => { clearTimeout(resized); resized = setTimeout(() => data && render(), 150); });
  load();
</script>
</body>
</html>
