<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest</title>
<link rel="stylesheet" href="common.css">
<style>
  .filters input[type="range"] { min-width: 200px; padding: 0; border: 0; background: none; accent-color: var(--mauve); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .tile { padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .tile small { display: block; color: var(--muted); font-size: .8rem; }
  .tile b { font-size: 1.3rem; }
  .tile .ci { margin-top: 2px; }
  .note { padding: 10px 14px; margin-bottom: 16px; border: 1px solid var(--red); border-radius: 10px; }
  .plus { color: var(--green); } .minus { color: var(--red); }
  .card { padding: 14px; margin-bottom: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  svg { display: block; width: 100%; height: 240px; }
  svg text { fill: var(--muted); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<main>
  <nav><a href="./">Upcoming</a><a href="backtest.html" aria-current="page">Backtest</a></nav>
  <header>
    <div>
      <h1>Backtest</h1>
      <p class="sub" id="summary">Loading…</p>
    </div>
    <button id="theme" title="Switch Catppuccin flavor"></button>
  </header>
  <p class="sub">Each season is predicted by a model fitted only on the seasons before it.
    Every game, the strategy bets 1 unit on the outcome with the highest expected value at
    Pinnacle's closing odds, when that EV is above the threshold.</p>
  <div class="filters">
    <label>Minimum EV: <output id="min-ev-label"></output>
      <input id="min-ev" type="range" min="0" max="30" step="1" value="5"></label>
    <label>League <select id="league"><option value="">All leagues</option></select></label>
  </div>
  <div id="result"></div>
</main>
<script src="common.js"></script>
<script>
  const pct = (x, digits = 1) => `${(x * 100).toFixed(digits)}%`;
  const signed = (x, fmt) => `${x > 0 ? "+" : ""}${fmt(x)}`;
  const tone = (x) => (x > 0 ? "plus" : x < 0 ? "minus" : "");

  function tile(label, value, className = "", note = "") {
    return el("div", { className: "tile" }, el("small", {}, label), el("b", { className }, value),
      ...(note ? [el("small", { className: "ci" }, note)] : []));
  }

  // ROI ± 1.96 standard errors: where the true ROI could be, given how much it swings.
  const ci = (t) => [t.roi - 1.96 * t.roi_se, t.roi + 1.96 * t.roi_se];

  function svg(tag, attrs, ...children) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    node.append(...children);
    return node;
  }

  // Cumulative profit per match day, with the zero line and the first and last date.
  // Drawn at the card's pixel width, so text keeps its size on a phone.
  function chart(points, w) {
    const h = 240, pad = { l: 44, r: 8, t: 10, b: 22 };
    const ys = points.map((p) => p.profit);
    const lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
    const x = (i) => pad.l + (i / Math.max(points.length - 1, 1)) * (w - pad.l - pad.r);
    const y = (v) => pad.t + (hi - v) / (hi - lo || 1) * (h - pad.t - pad.b);
    const last = ys.at(-1);
    // Axis labels at the top, zero and bottom, leaving out any that would overlap zero.
    const ticks = [hi, 0, lo].filter((v) => v === 0 || Math.abs(y(v) - y(0)) > 14);
    return svg("svg", { viewBox: `0 0 ${w} ${h}`, role: "img",
        "aria-label": `Cumulative profit, ending at ${last.toFixed(1)} units` },
      svg("line", { x1: pad.l, x2: w - pad.r, y1: y(0), y2: y(0), stroke: "var(--border)" }),
      svg("polyline", { fill: "none", "stroke-width": 2, stroke: last >= 0 ? "var(--green)" : "var(--red)",
        points: points.map((p, i) => `${x(i)},${y(p.profit)}`).join(" ") }),
      ...ticks.map((v) => svg("text", { x: pad.l - 6, y: y(v) + 4, "text-anchor": "end" }, v.toFixed(0))),
      svg("text", { x: pad.l, y: h - 4 }, points[0].day),
      svg("text", { x: w - pad.r, y: h - 4, "text-anchor": "end" }, points.at(-1).day));
  }

  function seasonTable(rows) {
    const head = ["Season", "Bets", "Hit rate", "Profit", "ROI"].map((t) => el("th", {}, t));
    return el("table", {}, el("tr", {}, ...head), ...rows.map((r) => el("tr", {},
      el("td", {}, `${r.season_start}/${String((r.season_start + 1) % 100).padStart(2, "0")}`),
      el("td", {}, r.bets),
      el("td", {}, pct(r.hit_rate)),
      el("td", { className: tone(r.profit) }, signed(r.profit, (v) => v.toFixed(1))),
      el("td", { className: tone(r.roi) }, signed(r.roi, pct)))));
  }

  // Each season bet at the threshold that did best before it, as a live bettor must choose.
  function walkForwardCard(rows) {
    const bets = rows.reduce((n, r) => n + r.bets, 0);
    const profit = rows.reduce((n, r) => n + r.profit, 0);
    const head = ["Season", "Threshold", "Bets", "Profit", "ROI"].map((t) => el("th", {}, t));
    return el("div", { className: "card" },
      el("h2", {}, "Threshold chosen without hindsight"),
      el("p", { className: "sub" }, "The slider lets you pick the threshold after seeing the results, "
        + "which flatters them. Here each season bets at the threshold that made the most on the "
        + "seasons before it only. Total: ",
        el("b", { className: tone(profit) }, `${signed(profit, (v) => v.toFixed(1))} units`),
        ` on ${bets.toLocaleString()} bets` + (bets ? `, ROI ${signed(profit / bets, pct)}` : "") + "."
        + ($("league").value ? " Choosing the league after seeing its results flatters them "
          + "the same way; All leagues makes no such choice." : "")),
      el("table", {}, el("tr", {}, ...head), ...rows.map((r) => el("tr", {},
        el("td", {}, `${r.season_start}/${String((r.season_start + 1) % 100).padStart(2, "0")}`),
        el("td", {}, pct(r.min_ev, 0)),
        el("td", {}, r.bets),
        el("td", { className: tone(r.profit) }, signed(r.profit, (v) => v.toFixed(1))),
        el("td", { className: tone(r.roi ?? 0) }, r.roi == null ? "–" : signed(r.roi, pct))))));
  }

  let latest = null;

  function render(data) {
    latest = data;
    const t = data.total;
    $("summary").textContent = `${data.games} games with odds`;
    if (!t.bets) {
      $("result").replaceChildren(el("div", { className: "empty" }, "No bet clears this threshold."));
      return;
    }
    const [lo, hi] = ci(t);
    const unsure = t.roi_se != null && lo < 0 && hi > 0;
    $("result").replaceChildren(
      ...(unsure ? [el("div", { className: "note" }, "The 95% range of the ROI includes zero: "
        + "this result is within what luck alone produces. It is not evidence of an edge.")] : []),
      el("div", { className: "tiles" },
        tile("Bets", t.bets.toLocaleString()),
        tile("Hit rate", pct(t.hit_rate)),
        tile("Profit (units)", signed(t.profit, (v) => v.toFixed(1)), tone(t.profit)),
        tile("ROI", signed(t.roi, pct), tone(t.roi),
          t.roi_se == null ? "" : `95% range ${signed(lo, pct)} to ${signed(hi, pct)}`),
        tile("Log loss: model / bookmaker",
          `${data.log_loss.model.toFixed(3)} / ${data.log_loss.market.toFixed(3)}`)),
      el("div", { className: "card", id: "chart" }, el("h2", {}, "Cumulative profit")),
      el("div", { className: "card" }, el("h2", {}, "By season"), seasonTable(data.by_season)),
      ...(data.walk_forward.length ? [walkForwardCard(data.walk_forward)] : []));
    drawChart();
  }

  function drawChart() {
    const card = $("chart");
    if (!card || !latest) return;
    card.querySelector("svg")?.remove();
    card.append(chart(latest.cumulative_profit, card.clientWidth - 28));
  }

  async function load() {
    const minEv = $("min-ev").value / 100;
    $("min-ev-label").textContent = pct(minEv, 0);
    const params = new URLSearchParams({ min_ev: minEv });
    if ($("league").value) params.set("league", $("league").value);
    const res = await fetch(`backtest?${params}`);
    if (!res.ok) {
      $("summary").textContent = "";
      $("result").replaceChildren(notRun("backtest", "backtest"));
      return;
    }
    const data = await res.json();
    if ($("league").options.length === 1) {
      options($("league"), data.leagues, (v) => el("option", { value: v }, v));
    }
    render(data);
  }

  $("min-ev").value = stored("min-ev") || 5;
  $("min-ev").addEventListener("input", () => { store("min-ev", $("min-ev").value); load(); });
  $("league").addEventListener("change", load);
  addEventListener("resize", drawChart);
  load();
</script>
</body>
</html>
