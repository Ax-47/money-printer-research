<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming predictions</title>
<style>
  :root {
    --bg: #eff1f5; --panel: #ffffff; --text: #4c4f69; --muted: #6c6f85; --border: #ccd0da;
    --home: #1e66f5; --draw: #8c8fa1; --away: #fe640b; --bar-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e2e; --panel: #313244; --text: #cdd6f4; --muted: #a6adc8; --border: #45475a;
      --home: #89b4fa; --draw: #7f849c; --away: #fab387; --bar-text: #1e1e2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  select, input {
    min-width: 200px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text); font: inherit;
  }
  .legend { display: flex; gap: 16px; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; background: var(--c);
  }
  .match {
    display: grid; grid-template-columns: 110px 1fr minmax(220px, 1.2fr); gap: 12px; align-items: center;
    padding: 12px 14px; margin-bottom: 8px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .when { font-size: .85rem; }
  .when small { display: block; color: var(--muted); }
  .teams { font-weight: 600; }
  .teams span { text-transform: capitalize; }
  .teams .fav { text-decoration: underline; text-underline-offset: 3px; }
  .teams small { display: block; font-weight: 400; color: var(--muted); }
  .bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; }
  .bar div {
    display: flex; align-items: center; justify-content: center; min-width: 0;
    color: var(--bar-text); font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden;
  }
  .H { background: var(--home); } .D { background: var(--draw); } .A { background: var(--away); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  code { background: var(--panel); padding: 1px 6px; border-radius: 4px; }
  @media (max-width: 640px) {
    .match { grid-template-columns: 1fr; gap: 6px; }
  }
</style>
</head>
<body>
<main>
  <h1>Upcoming predictions</h1>
  <p class="sub" id="summary">Loading…</p>
  <div class="filters">
    <label>League <select id="league"><option value="">All leagues</option></select></label>
    <label>Team <input id="team" list="teams" placeholder="Any team"></label>
    <datalist id="teams"></datalist>
  </div>
  <div class="legend">
    <span style="--c: var(--home)">Home win</span>
    <span style="--c: var(--draw)">Draw</span>
    <span style="--c: var(--away)">Away win</span>
  </div>
  <div id="matches"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const pct = (p) => `${Math.round(p * 100)}%`;
  let fixtures = [];

  function el(tag, attrs = {}, ...children) {
    const node = Object.assign(document.createElement(tag), attrs);
    node.append(...children);
    return node;
  }

  function options(target, values, make) {
    target.append(...[...new Set(values)].sort().map(make));
  }

  function row(f) {
    const date = new Date(f.date);
    const fav = f.p_H >= f.p_A ? f.home_team : f.away_team;
    const team = (name) => el("span", { className: name === fav ? "fav" : "" }, name);
    const bar = el("div", { className: "bar" }, ...["H", "D", "A"].map((k) =>
      el("div", { className: k, style: `width: ${f[`p_${k}`] * 100}%`, title: pct(f[`p_${k}`]) },
        f[`p_${k}`] >= 0.12 ? pct(f[`p_${k}`]) : "")));
    return el("div", { className: "match" },
      el("div", { className: "when" },
        date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }),
        el("small", {}, date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }))),
      el("div", { className: "teams" }, team(f.home_team), " vs ", team(f.away_team),
        el("small", {}, f.league)),
      bar);
  }

  function render() {
    const league = $("league").value;
    const team = $("team").value.trim().toLowerCase();
    const shown = fixtures.filter((f) =>
      (!league || f.league === league) &&
      (!team || f.home_team.toLowerCase().includes(team) || f.away_team.toLowerCase().includes(team)));
    $("summary").textContent = `${shown.length} of ${fixtures.length} unplayed fixtures`;
    $("matches").replaceChildren(...(shown.length
      ? shown.map(row)
      : [el("div", { className: "empty" }, "No fixture matches these filters.")]));
  }

  async function load() {
    const res = await fetch("upcoming");
    if (!res.ok) {
      $("summary").textContent = "";
      $("matches").replaceChildren(el("div", { className: "empty" },
        "No predictions yet. Run ", el("code", {}, "uv run predict"), " and reload."));
      return;
    }
    fixtures = await res.json();
    options($("league"), fixtures.map((f) => f.league), (v) => el("option", { value: v }, v));
    options($("teams"), fixtures.flatMap((f) => [f.home_team, f.away_team]),
      (v) => el("option", { value: v }));
    render();
  }

  $("league").addEventListener("change", render);
  $("team").addEventListener("input", render);
  load();
</script>
</body>
</html>
