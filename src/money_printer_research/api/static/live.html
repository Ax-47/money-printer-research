<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Games</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="common.css">
<style>
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 12px;
    align-items: start; }
  .game { padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); }
  .game.in { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: .8rem; color: var(--muted); }
  .chip { padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-weight: 500;
    background: color-mix(in srgb, var(--surface0) 60%, transparent); }
  .state { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--text); }
  .state.in { color: var(--red); }
  .state.in::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red);
    animation: pulse 1.4s ease-in-out infinite; }
  .state.post { color: var(--muted); }
  @keyframes pulse { 50% { opacity: .3; } }
  .teams { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; font-size: 1.02rem; }
  .teams a { color: var(--text); text-decoration: none; text-transform: capitalize; }
  .teams a:hover { color: var(--accent); text-decoration: underline; }
  .score { font-size: 1.25rem; font-weight: 700; text-align: right; min-width: 1.5ch; }
  .preds { display: grid; gap: 8px; margin-top: 12px; }
  .pred { display: grid; grid-template-columns: 8.5em 1fr; gap: 10px; align-items: center; font-size: .82rem; }
  .pred > span { color: var(--muted); }
  .pred.now > span { color: var(--text); font-weight: 600; }
  .bar { display: flex; height: 18px; border-radius: 5px; overflow: hidden; gap: 2px; }
  .bar div { min-width: 2px; display: grid; place-items: center; color: var(--bar-text); font-size: .72rem; font-weight: 600; }
  .H { background: var(--home); } .D { background: var(--draw); } .A { background: var(--away); }
  .waiting { color: var(--muted); font-style: italic; }
  .toggle { margin-top: 10px; padding: 0; border: 0; background: none; color: var(--accent);
    font: inherit; font-size: .84rem; font-weight: 500; cursor: pointer; }
  .toggle:hover { text-decoration: underline; }
  .xis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; font-size: .82rem; }
  .xis h4 { margin: 0 0 4px; font-size: .8rem; color: var(--muted); text-transform: capitalize; }
  .xis ol { margin: 0; padding: 0; list-style: none; }
  .xis li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  .xis li .f { color: var(--muted); white-space: nowrap; }
  .xis li.unmatched .n { color: var(--muted); font-style: italic; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: .82rem; color: var(--muted); margin: 0 0 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    margin-right: 6px; background: var(--c); }
  .updated { font-size: .8rem; color: var(--muted); }
  @media (max-width: 520px) { .xis { grid-template-columns: 1fr; } .pred { grid-template-columns: 7em 1fr; } }
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="./"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V13M10 19V9M16 19V12M3 8l6-4 5 4 7-5"/></svg></span>
    <span>Money Printer<small data-i18n="brand_sub">Football market research</small></span></a>
  <nav><a href="./" data-i18n="nav_upcoming">Upcoming</a><a href="live.html" data-i18n="nav_live" aria-current="page">Live</a><a href="teams.html" data-i18n="nav_teams">Teams</a><a href="backtest.html" data-i18n="nav_backtest">Backtest</a><a href="analysis.html" data-i18n="nav_analysis">Analysis</a></nav>
  <div class="tools"><div id="lang" class="seg" role="group"></div><button id="theme" type="button" data-i18n-title="theme_title"></button></div>
</div></header>
<main>
  <div class="hero">
    <h1 data-i18n="title">Today's games</h1>
    <p class="sub"><span id="summary"></span> <span class="updated" id="updated"></span></p>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="filters">
    <label><span data-i18n="league">League</span> <select id="league"><option value="" data-i18n="all_leagues">All leagues</option></select></label>
  </div>
  <div class="legend">
    <span style="--c: var(--home)" data-i18n="home_win">Home win</span>
    <span style="--c: var(--draw)" data-i18n="draw">Draw</span>
    <span style="--c: var(--away)" data-i18n="away_win">Away win</span>
  </div>
  <div id="games"></div>
</main>
<script src="common.js"></script>
<script>
  addStrings({
    en: {
      title: "Today's games",
      summary: "{n} games today. Scores from ESPN; the prediction is redone once both starting XIs are announced.",
      updated: "Updated {time}",
      playing: "Playing now", today: "Games today", lineups: "Line-ups in", finished: "Finished",
      league: "League", all_leagues: "All leagues",
      home_win: "Home win", draw: "Draw", away_win: "Away win", H: "Home", D: "Draw", A: "Away",
      before: "Before line-ups", after: "With line-ups", no_pred: "No prediction (fixture not matched)",
      waiting: "Waiting for the starting XIs", show_xi: "Show line-ups", hide_xi: "Hide line-ups",
      form: "{form} xG+xA/90 · {min}′", no_form: "under 270′", unmatched: "not found in Understat",
      none: "No games today in the five leagues.", pre: "Kick-off {time}", post: "Full time",
    },
    th: {
      title: "แมตช์วันนี้",
      summary: "วันนี้มี {n} นัด สกอร์จาก ESPN ผลทำนายจะคำนวณใหม่เมื่อทั้งสองทีมประกาศตัวจริงแล้ว",
      updated: "อัปเดต {time}",
      playing: "กำลังแข่ง", today: "นัดวันนี้", lineups: "ไลน์อัปออกแล้ว", finished: "จบแล้ว",
      league: "ลีก", all_leagues: "ทุกลีก",
      home_win: "เจ้าบ้านชนะ", draw: "เสมอ", away_win: "ทีมเยือนชนะ", H: "เจ้าบ้าน", D: "เสมอ", A: "ทีมเยือน",
      before: "ก่อนรู้ไลน์อัป", after: "หลังรู้ไลน์อัป", no_pred: "ไม่มีผลทำนาย (จับคู่นัดไม่ได้)",
      waiting: "รอประกาศตัวจริง", show_xi: "ดูไลน์อัป", hide_xi: "ซ่อนไลน์อัป",
      form: "{form} xG+xA/90 · {min}′", no_form: "ลงเล่นไม่ถึง 270′", unmatched: "ไม่พบใน Understat",
      none: "วันนี้ไม่มีแมตช์ใน 5 ลีก", pre: "เตะ {time}", post: "จบเกม",
    },
  });

  const OUTCOMES = ["H", "D", "A"];
  const REFRESH_MS = 30000;
  const pct = (p) => `${Math.round(p * 100)}%`;
  const time = (iso) => new Date(iso).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
  let games = [];
  const open = new Set();

  function stateLabel(g) {
    if (g.state === "in") return g.detail;
    if (g.state === "post") return t("post");
    return t("pre", { time: time(g.kickoff) });
  }

  function bar(p) {
    const node = el("div", { className: "bar" }, ...OUTCOMES.map((k) =>
      el("div", { className: k, style: `flex: ${p[k]}`, title: `${t(k)} ${pct(p[k])}` }, p[k] >= 0.12 ? pct(p[k]) : "")));
    node.setAttribute("role", "img");
    node.setAttribute("aria-label", OUTCOMES.map((k) => `${t(k)} ${pct(p[k])}`).join(", "));
    return node;
  }

  const probs = (g, src) => g[`${src}_p_H`] == null ? null
    : { H: g[`${src}_p_H`], D: g[`${src}_p_D`], A: g[`${src}_p_A`] };

  function predictions(g) {
    const before = probs(g, "fixture"), after = probs(g, "lineup");
    if (!before && !after) return el("div", { className: "waiting" }, t("no_pred"));
    return el("div", { className: "preds" },
      before ? el("div", { className: `pred${after ? "" : " now"}` }, el("span", {}, t("before")), bar(before)) : "",
      after ? el("div", { className: "pred now" }, el("span", {}, t("after")), bar(after))
        : el("div", { className: "pred" }, el("span", {}, t("after")), el("span", { className: "waiting" }, t("waiting"))));
  }

  function teamLink(name, espnName) {
    return name ? el("a", { href: `teams.html#${encodeURIComponent(name)}` }, name) : el("span", {}, espnName);
  }

  function player(p) {
    const matched = p.player_id != null;
    const form = !matched ? t("unmatched") : p.form90 == null ? t("no_form")
      : t("form", { form: p.form90.toFixed(2), min: Math.round(p.prev_min) });
    return el("li", { className: matched ? "" : "unmatched" },
      el("span", { className: "n" }, p.name), el("span", { className: "f" }, form));
  }

  async function lineups(g, box) {
    const res = await fetch(`live/${encodeURIComponent(g.espn_id)}`);
    if (!res.ok) return;
    const body = await res.json();
    const side = (s, name) => el("div", {}, el("h4", {}, name),
      el("ol", {}, ...body.lineup.filter((p) => p.side === s).map(player)));
    box.replaceChildren(el("div", { className: "xis" },
      side("home", g.home_team || g.espn_home), side("away", g.away_team || g.espn_away)));
  }

  function card(g) {
    const node = el("article", { className: `game ${g.state}` });
    const scored = g.home_score != null;
    const parts = [
      el("div", { className: "top" },
        el("span", { className: `state ${g.state}` }, stateLabel(g)), el("span", { className: "chip" }, g.league)),
      el("div", { className: "teams" },
        teamLink(g.home_team, g.espn_home), el("span", { className: "score" }, scored ? g.home_score : ""),
        teamLink(g.away_team, g.espn_away), el("span", { className: "score" }, scored ? g.away_score : "")),
      predictions(g),
    ];
    if (g.has_lineup) {
      const box = el("div");
      const toggle = el("button", { className: "toggle", type: "button" });
      const label = () => { toggle.textContent = open.has(g.espn_id) ? t("hide_xi") : t("show_xi"); };
      const show = () => { label(); if (open.has(g.espn_id)) lineups(g, box); else box.replaceChildren(); };
      toggle.addEventListener("click", () => {
        open.has(g.espn_id) ? open.delete(g.espn_id) : open.add(g.espn_id);
        show();
      });
      show();
      parts.push(toggle, box);
    }
    node.append(...parts);
    return node;
  }

  function tile(label, value) {
    return el("div", { className: "tile" }, el("small", {}, label), el("b", {}, value));
  }

  function render() {
    const league = $("league").value;
    const shown = games.filter((g) => !league || g.league === league);
    $("summary").textContent = t("summary", { n: shown.length });
    const count = (f) => shown.filter(f).length.toLocaleString(locale());
    $("tiles").replaceChildren(
      tile(t("playing"), count((g) => g.state === "in")),
      tile(t("today"), count(() => true)),
      tile(t("lineups"), count((g) => g.has_lineup)),
      tile(t("finished"), count((g) => g.state === "post")));
    if (!shown.length) {
      $("games").replaceChildren(el("div", { className: "empty" }, t("none")));
      return;
    }
    // Playing first, then the ones still to come, then the finished ones.
    const order = { in: 0, pre: 1, post: 2 };
    const sorted = [...shown].sort((a, b) => order[a.state] - order[b.state] || a.kickoff.localeCompare(b.kickoff));
    $("games").replaceChildren(el("div", { className: "list" }, ...sorted.map(card)));
  }

  async function load() {
    const res = await fetch("live");
    if (!res.ok) return;
    games = await res.json();
    const select = $("league");
    const known = new Set([...select.options].map((o) => o.value));
    options(select, games.map((g) => g.league).filter((l) => !known.has(l)), (v) => el("option", { value: v }, v));
    select.value = stored("live-league");
    $("updated").textContent = t("updated", { time: new Date().toLocaleTimeString(locale()) });
    render();
  }

  $("league").addEventListener("change", () => { store("live-league", $("league").value); render(); });
  onLang(render);
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
