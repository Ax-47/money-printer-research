# The pre-registered strategy suite (issue #39), read by `uv run strategies`.
#
# Written before any of these strategies was run on the data. Change it only in a
# commit that says so: the report prints the commit of this file it ran with, so a
# reader can check nothing was added or tuned after seeing the results.
#
# Every strategy bets 1 unit per bet. A list of values for a parameter means each
# value is its own variant, and every variant counts towards the multiple-comparison
# correction. On top of that, `strategies` picks the value walk-forward: each season
# uses the value that made the most on the seasons before it.
#
# kind        what it bets
#   model_ev    the outcome with the highest expected value under the model, when that
#               EV is above min_edge (the model is market.py's market_and_form)
#   model_draw  the draw, when the model's P(draw) is above the market's by min_edge
#   favourite   the outcome with the shortest price
#   longshot    the outcome with the longest price
#   odds_band   every outcome priced from low (inclusive) to high (exclusive)
#   always      one fixed selection in every game
#   value       any selection whose price, times Pinnacle's margin-free probability at
#               the same moment, is above 1 + min_edge (Kaunitz et al. 2017)
#
# price is [source, timing] from analysis/odds.py: where the bet is placed.

test_from = 2016  # seasons scored; earlier ones only train the model and choices

[[strategy]]
name = "model EV, Pinnacle early"
kind = "model_ev"
market = "1x2"
price = ["pinnacle", "early"]
min_edge = [0.0, 0.02, 0.05, 0.1, 0.2]

[[strategy]]
name = "model EV, best price early"
kind = "model_ev"
market = "1x2"
price = ["max", "early"]
min_edge = [0.0, 0.02, 0.05, 0.1, 0.2]

